name: Update 4D results

on:
  schedule:
    # Start at 6:47pm and 6:57pm; catch-up ticks every five minutes.
    # Each active job polls for up to 20 minutes rather than relying on every tick.
    # West Malaysia draws normally release from 7pm; regional operators can vary.
    - cron: "47,57 10 * * *"
    - cron: "2-57/5 11-14 * * *"
    # Off-boundary hourly catch-up outside the prime window, including special draws.
    - cron: "17 0-10,15-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll and publish verified results
        env:
          HUAWEI_RESULTS_BASE: https://api.huawei88.org
          HUAWEI_RESULTS_MID: ${{ secrets.HUAWEI_RESULTS_MID }}
          HUAWEI_RESULTS_PW: ${{ secrets.HUAWEI_RESULTS_PW }}
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: never
        run: python scripts/release_results.py --publish

      - name: Preserve dated generated-file backups on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: my4d-result-backups-${{ github.run_id }}
          path: ${{ runner.temp }}/my4d-result-backups/
          if-no-files-found: ignore
          retention-days: 3
