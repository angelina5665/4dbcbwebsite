name: Site health watchman

on:
  schedule:
    # a few times around each evening draw window, plus one daytime check
    - cron: "50 10,12,14 * * *"
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      test_alarm:
        description: "Send a practice alert to prove the email works"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the whole results chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          status=0
          python healthcheck.py > report.txt 2>&1 || status=1

          # the results robot crashing several runs in a row is a problem on its own
          fails=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Update 4D results" --limit 3 \
                    --json conclusion --jq '[.[] | select(.conclusion == "failure")] | length')
          if [ "$fails" = "3" ]; then
            echo " - The results robot has failed its last 3 runs" >> report.txt
            status=1
          fi

          if [ "${{ inputs.test_alarm }}" = "true" ]; then
            echo " - PRACTICE ALARM: this is only a test that the alert email reaches you. Nothing is wrong." >> report.txt
            status=1
          fi

          cat report.txt
          exit $status

      - name: Raise the alarm (opens an issue, which emails the owner)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Site health alert in:title" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Site health alert: results chain has a problem" \
              --body "The automatic watchman found a problem:

          $(cat report.txt)

          Open a Claude session and say: fix the site health alert."
          else
            echo "Alert issue already open - not duplicating."
          fi

      - name: Close the alarm when healthy again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Site health alert in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Watchman reports everything healthy again."
          done
