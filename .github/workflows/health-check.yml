name: Site health watchman

on:
  schedule:
    # a few times around each evening draw window, plus one daytime check
    - cron: "50 10,11,12,14 * * *"
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      test_alarm:
        description: "Send a practice alert to prove the email works"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install a browser for the screen check
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Check the whole results chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          status=0
          python healthcheck.py > report.txt 2>&1 || status=1

          # what a visitor actually sees: every card compared with the live source
          node scripts/visitor_view_check.mjs >> report.txt 2>&1 || status=1

          # the shared rule book both AI tools must keep passing
          if ! node --test scripts/*.test.mjs > tests.txt 2>&1; then
            echo " - Site tests are failing (a recent change broke a protected feature):" >> report.txt
            grep -E "^not ok|AssertionError|Error:" tests.txt | head -8 | sed 's/^/     /' >> report.txt
            status=1
          fi

          # the results robot crashing several runs in a row is a problem on its own
          fails=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Update 4D results" --limit 3 \
                    --json conclusion --jq '[.[] | select(.conclusion == "failure")] | length')
          if [ "$fails" = "3" ]; then
            echo " - The results robot has failed its last 3 runs" >> report.txt
            status=1
          fi

          # The result timestamp changes only for factual draw changes, so verify
          # scheduler activity from Actions metadata instead of touching results.json.
          last_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Update 4D results" --limit 1 \
                       --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$last_run" ]; then
            echo " - The results robot has no recorded run" >> report.txt
            status=1
          else
            last_epoch=$(date -u -d "$last_run" +%s)
            now_epoch=$(date -u +%s)
            if [ $((now_epoch - last_epoch)) -gt 10800 ]; then
              echo " - The results robot has not run for more than 3 hours (last run: $last_run)" >> report.txt
              status=1
            fi
          fi

          if [ "${{ inputs.test_alarm }}" = "true" ]; then
            echo " - PRACTICE ALARM: this is only a test that the alert email reaches you. Nothing is wrong." >> report.txt
            status=1
          fi

          cat report.txt
          exit $status

      - name: Raise the alarm (opens an issue, which emails the owner)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Site health alert in:title" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Site health alert: results chain has a problem" \
              --body "The automatic watchman found a problem:

          $(cat report.txt)

          Open a Claude session and say: fix the site health alert."
          else
            echo "Alert issue already open - not duplicating."
          fi

      - name: Close the alarm when healthy again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Site health alert in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Watchman reports everything healthy again."
          done
